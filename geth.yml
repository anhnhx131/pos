version: "3.8"

services:
  execution:
    restart: unless-stopped
    image: ${GETH_IMAGE:-ethereum/client-go:v1.11.6}
    pull_policy: if_not_present
    stop_grace_period: 1m
    volumes:
      - ${GETH_DATA_DIR:-./data/el/geth}:/data
      - ${EL_CONFIG_DIR:-./config/el}:/config
      - ${JWT_SECRET_DIR:-./shared/jwt}:/jwt
      - /etc/localtime:/etc/localtime:ro
    environment:
      - EL_GENESIS_FILE=${EL_GENESIS_FILE:-genesis.json}
      - EL_GENESIS_JSON=${EL_GENESIS_JSON:-}
      - EL_NETWORK_ID=${EL_NETWORK_ID:-32382}
      - EL_BOOTNODES=${EL_BOOTNODES:-}
      - EL_HTTP_PORT=${EL_HTTP_PORT:-8545}
      - EL_WS_PORT=${EL_WS_PORT:-8546}
      - EL_AUTH_RPC_PORT=${EL_AUTH_RPC_PORT:-8551}
      - EL_METRICS_PORT=${EL_METRICS_PORT:-6060}
      - EL_HTTP_APIS=${EL_HTTP_APIS:-eth,net,web3,engine,admin,debug,txpool}
      - EL_SYNC_MODE=${EL_SYNC_MODE:-full}
      - EL_GC_MODE=${EL_GC_MODE:-full}
      - EL_EXTRAS=${EL_EXTRAS:-}
      - JWT_SECRET_FILENAME=${JWT_SECRET_FILENAME:-jwtsecret}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        DATA_DIR=/data
        GENESIS_PATH="/config/${EL_GENESIS_FILE:-genesis.json}"
        mkdir -p "${DATA_DIR}"
        if [ -n "${EL_GENESIS_JSON:-}" ]; then
          mkdir -p /config
          printf '%s\n' "${EL_GENESIS_JSON}" > "${GENESIS_PATH}"
        fi
        if [ -f "${GENESIS_PATH}" ] && [ ! -d "${DATA_DIR}/geth/chaindata" ]; then
          echo "Initializing geth datadir with ${GENESIS_PATH}"
          geth init --datadir "${DATA_DIR}" "${GENESIS_PATH}"
        fi
        if [ -n "${JWT_SECRET:-}" ]; then
          printf '%s' "${JWT_SECRET}" > "/jwt/${JWT_SECRET_FILENAME:-jwtsecret}"
        fi
        if [ ! -s "/jwt/${JWT_SECRET_FILENAME:-jwtsecret}" ]; then
          od -An -tx1 -N32 /dev/urandom | tr -d ' \n' | head -c 64 > "/jwt/${JWT_SECRET_FILENAME:-jwtsecret}"
        fi
        BOOTNODES_ARG=""
        if [ -n "${EL_BOOTNODES:-}" ]; then
          BOOTNODES_ARG="--bootnodes=${EL_BOOTNODES}"
        fi
        # shellcheck disable=SC2086
        exec geth \
          --datadir="${DATA_DIR}" \
          --networkid="${EL_NETWORK_ID:-32382}" \
          --authrpc.addr=0.0.0.0 \
          --authrpc.port="${EL_AUTH_RPC_PORT:-8551}" \
          --authrpc.vhosts="*" \
          --authrpc.jwtsecret="/jwt/${JWT_SECRET_FILENAME:-jwtsecret}" \
          --syncmode="${EL_SYNC_MODE:-full}" \
          --gcmode="${EL_GC_MODE:-full}" \
          --http \
          --http.addr=0.0.0.0 \
          --http.port="${EL_HTTP_PORT:-8545}" \
          --http.corsdomain="*" \
          --http.api="${EL_HTTP_APIS:-eth,net,web3,engine,admin,debug,txpool}" \
          --ws \
          --ws.addr=0.0.0.0 \
          --ws.port="${EL_WS_PORT:-8546}" \
          --ws.origins="*" \
          --metrics \
          --metrics.addr=0.0.0.0 \
          --metrics.port="${EL_METRICS_PORT:-6060}" \
          ${BOOTNODES_ARG} \
          ${EL_EXTRAS:-}
    ports:
      - ${HOST_IP:-}:${EL_HTTP_PORT:-8545}:${EL_HTTP_PORT:-8545}
      - ${HOST_IP:-}:${EL_WS_PORT:-8546}:${EL_WS_PORT:-8546}
      - ${HOST_IP:-}:${EL_AUTH_RPC_PORT:-8551}:${EL_AUTH_RPC_PORT:-8551}
    networks:
      default:
        aliases:
          - execution
